# ============================================
# إعدادات nginx لـ Plesk
# ============================================
# انسخ هالمحتوى وألصقه بـ Plesk:
# Domains → muhitsolution.com → Apache & nginx Settings
# → Additional nginx directives
# ============================================

# ملفات الرفع — تقدم مباشرة من الملفات بدون proxy
location /uploads/ {
    alias /var/www/vhosts/muhitsolution.com/httpdocs/public/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# الباكند API
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
}

# الفرونت إند (Next.js) — كل شي ثاني
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
